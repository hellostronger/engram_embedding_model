<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" font-family="sans-serif">
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#334155"/>
    </marker>
    <marker id="a2b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#b91c1c"/>
    </marker>
    <marker id="a2g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="880" height="620" fill="#ffffff"/>
  <text x="440" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">
    Engram 核心洞察：把"静态知识"从"动态计算"中拆出来
  </text>
  <text x="440" y="50" text-anchor="middle" font-size="12.5" fill="#64748b">
    「Simulating retrieval through computation」 —— 用算力去模拟查表，是 Transformer 的结构性浪费
  </text>

  <!-- ================= LEFT: the wasteful path ================= -->
  <rect x="16" y="70" width="400" height="300" rx="7" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="216" y="94" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#991b1b">现状：无查原语（Primitive 缺失）</text>

  <rect x="34" y="106" width="364" height="34" rx="4" fill="#ffffff" stroke="#fca5a5"/>
  <text x="216" y="128" text-anchor="middle" font-size="11" fill="#7f1d1d">多 token 实体：「黛安娜，威尔士王妃」</text>

  <path d="M216,142 L216,158 M216,158 l-5,-7 M216,158 l5,-7" stroke="#b91c1c" stroke-width="1.3" fill="none"/>

  <rect x="34" y="162" width="364" height="30" rx="4" fill="#ffffff" stroke="#fca5a5"/>
  <text x="216" y="182" text-anchor="middle" font-size="10.5" fill="#7f1d1d">L1–2 Attention：拼出"威尔士=英国地区"</text>

  <rect x="34" y="198" width="364" height="30" rx="4" fill="#ffffff" stroke="#fca5a5"/>
  <text x="216" y="218" text-anchor="middle" font-size="10.5" fill="#7f1d1d">L3–4 Attention：拼出"王妃"头衔</text>

  <rect x="34" y="234" width="364" height="30" rx="4" fill="#ffffff" stroke="#fca5a5"/>
  <text x="216" y="254" text-anchor="middle" font-size="10.5" fill="#7f1d1d">L5 FFN：拼出"黛安娜·威尔士王妃"</text>

  <rect x="34" y="270" width="364" height="30" rx="4" fill="#ffffff" stroke="#fca5a5"/>
  <text x="216" y="290" text-anchor="middle" font-size="10.5" fill="#7f1d1d">L6 FFN：补全生平事实</text>

  <rect x="34" y="310" width="364" height="46" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.6"/>
  <text x="216" y="328" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">消耗 6 层深度去重建</text>
  <text x="216" y="345" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">一个静态查找表</text>

  <!-- ================= RIGHT: the efficient path ================= -->
  <rect x="464" y="70" width="400" height="300" rx="7" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
  <text x="664" y="94" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#166534">Engram：给静态知识一个查原语</text>

  <rect x="482" y="106" width="364" height="34" rx="4" fill="#ffffff" stroke="#86efac"/>
  <text x="664" y="128" text-anchor="middle" font-size="11" fill="#14532d">同样输入：x′ = …黛安娜, 王妃</text>

  <path d="M664,142 L664,162 M664,162 l-5,-7 M664,162 l5,-7" stroke="#15803d" stroke-width="1.3" fill="none"/>

  <rect x="482" y="166" width="172" height="44" rx="4" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="568" y="184" text-anchor="middle" font-size="10" font-weight="bold" fill="#713f12">哈希查表</text>
  <text x="568" y="200" text-anchor="middle" font-size="9.5" fill="#854d0e">O(1) 定位</text>

  <rect x="666" y="166" width="180" height="44" rx="4" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="756" y="184" text-anchor="middle" font-size="10" font-weight="bold" fill="#713f12">门控 α ≈ 1</text>
  <text x="756" y="200" text-anchor="middle" font-size="9.5" fill="#854d0e">上下文确认命中</text>

  <rect x="482" y="220" width="364" height="40" rx="4" fill="#dcfce7" stroke="#22c55e"/>
  <text x="664" y="238" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#14532d">L2 即获得该实体的静态表示</text>
  <text x="664" y="254" text-anchor="middle" font-size="9.5" fill="#166534">一次查表，替代 6 层的特征重建</text>

  <rect x="482" y="270" width="364" height="86" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.6"/>
  <text x="664" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">L3…L12 全部留给组合推理</text>
  <text x="664" y="310" text-anchor="middle" font-size="10" fill="#14532d">有效深度 ↑ → 泛化与长上下文能力提升</text>
  <text x="664" y="330" text-anchor="middle" font-size="10" fill="#14532d">原文实测：CKA 显示浅层≈基线深层</text>
  <text x="664" y="348" text-anchor="middle" font-size="9.5" fill="#166534">L5 表征对齐到基线约 L12</text>

  <!-- ================= BOTTOM: measured gains ================= -->
  <rect x="16" y="390" width="848" height="212" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="440" y="414" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">
    关键收益（Engram-27B vs 严格同参数 / 同 FLOPs 的 MoE-27B）
  </text>

  <rect x="34" y="428" width="196" height="156" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="132" y="450" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1d4ed8">知识检索</text>
  <text x="132" y="470" text-anchor="middle" font-size="9.5" fill="#64748b">（直觉上最该受益）</text>
  <line x1="50" y1="480" x2="214" y2="480" stroke="#e2e8f0"/>
  <text x="132" y="500" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">MMLU  +3.4</text>
  <text x="132" y="522" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">CMMLU +4.0</text>
  <text x="132" y="544" text-anchor="middle" font-size="11" fill="#334155">MMLU-Pro +1.8</text>
  <text x="132" y="568" text-anchor="middle" font-size="9.5" fill="#64748b">把 FFN 的 KV 记忆职能</text>
  <text x="132" y="580" text-anchor="middle" font-size="9.5" fill="#64748b">外包给显式查表</text>

  <rect x="242" y="428" width="196" height="156" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="340" y="450" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b91c1c">通用推理</text>
  <text x="340" y="470" text-anchor="middle" font-size="9.5" fill="#64748b">（反直觉地受益更大）</text>
  <line x1="258" y1="480" x2="422" y2="480" stroke="#e2e8f0"/>
  <text x="340" y="500" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">BBH  +5.0</text>
  <text x="340" y="522" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">ARC-C  +3.7</text>
  <text x="340" y="544" text-anchor="middle" font-size="11" fill="#334155">DROP +3.3</text>
  <text x="340" y="568" text-anchor="middle" font-size="9.5" fill="#64748b">早期不再做静态重建</text>
  <text x="340" y="580" text-anchor="middle" font-size="9.5" fill="#64748b">有效深度 ↑</text>

  <rect x="450" y="428" width="196" height="156" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="548" y="450" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">长上下文</text>
  <text x="548" y="470" text-anchor="middle" font-size="9.5" fill="#64748b">（attention 预算释放）</text>
  <line x1="466" y1="480" x2="630" y2="480" stroke="#e2e8f0"/>
  <text x="548" y="500" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">MQ-NIAH 84→97</text>
  <text x="548" y="522" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">VT 77→89</text>
  <text x="548" y="544" text-anchor="middle" font-size="11" fill="#334155">RULER 全线提升</text>
  <text x="548" y="568" text-anchor="middle" font-size="9.5" fill="#64748b">局部依赖交给查表</text>
  <text x="548" y="580" text-anchor="middle" font-size="9.5" fill="#64748b">attention 专注全局</text>

  <rect x="658" y="428" width="192" height="156" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="754" y="450" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a16207">代码 / 数学</text>
  <text x="754" y="470" text-anchor="middle" font-size="9.5" fill="#64748b">模板化模式受益</text>
  <line x1="674" y1="480" x2="834" y2="480" stroke="#e2e8f0"/>
  <text x="754" y="500" text-anchor="middle" font-size="13" font-weight="bold" fill="#a16207">HumanEval +3.0</text>
  <text x="754" y="522" text-anchor="middle" font-size="13" font-weight="bold" fill="#a16207">MATH  +2.4</text>
  <text x="754" y="544" text-anchor="middle" font-size="11" fill="#334155">GSM8K +2.2</text>
  <text x="754" y="568" text-anchor="middle" font-size="9.5" fill="#64748b">惯用法 / 惯用结构</text>
  <text x="754" y="580" text-anchor="middle" font-size="9.5" fill="#64748b">本质仍是局部模式</text>
</svg>